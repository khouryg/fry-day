name: FryDay
options:
  bundleIdPrefix: com.khouryg.fryday
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: false
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5G2JU987CA
targets:
  FryDay:
    type: application
    platform: iOS
    sources:
      - Sources
      - Shared
      - path: Resources/Assets.xcassets
      - path: Resources/LaunchScreen.storyboard
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Fry Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: Fry Day uses your location to request the local UV forecast from Open-Meteo.
        NSHealthShareUsageDescription: Optionally read your age and skin type to personalize exposure estimates on this device.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.khouryg.fryday
            CFBundleURLSchemes: [fryday]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khouryg.fryday
        CODE_SIGN_ENTITLEMENTS: Resources/Sunday.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: FryDayIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: FryDayWidget
  FryDayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SundayWidget
        excludes: [Info.plist, SundayWidget.intentdefinition, SundayWidget.entitlements]
      - Shared
      - Sources/Models/UVSample.swift
      - Sources/Models/WeatherForecast.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: SundayWidget/Info.plist
      properties:
        CFBundleDisplayName: Fry Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khouryg.fryday.widget
        CODE_SIGN_ENTITLEMENTS: SundayWidget/SundayWidget.entitlements
        SKIP_INSTALL: true
  FryDayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.khouryg.fryday.tests
    dependencies:
      - target: FryDay
schemes:
  FryDay:
    build:
      targets:
        FryDay: all
        FryDayTests: [test]
    test:
      targets: [FryDayTests]
